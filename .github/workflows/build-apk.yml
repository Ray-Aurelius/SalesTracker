name: Build app

# Runs every time code is pushed to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the app's permanent signing key
        env:
          KEY: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SIGNING_KEYSTORE secret is not set - this build can't update an installed copy in place."
            exit 0
          fi
          # Copying a long line on a phone can add spaces or line breaks; drop anything that isn't base64.
          CLEAN=$(printf '%s' "$KEY" | tr -cd 'A-Za-z0-9+/=')
          echo "Key text: ${#KEY} characters pasted, ${#CLEAN} usable (expected 1388), starts ${CLEAN:0:4}, ends ${CLEAN: -4}"
          if ! printf '%s' "$CLEAN" | base64 -d > app/stable.keystore 2>/dev/null \
             || ! keytool -list -keystore app/stable.keystore -storepass salestracker -alias salestracker >/dev/null 2>&1; then
            echo "::error::SIGNING_KEYSTORE could not be read as the signing key (${#CLEAN} of 1388 characters, starts ${CLEAN:0:4}, ends ${CLEAN: -4}). Re-paste the full text from start to end."
            exit 1
          fi
          echo "Signing with the permanent key."

      - name: Run tests and build the APK and Play Store bundle
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log; then
            # Surface compiler/test errors as annotations so they're readable without the full log.
            grep -E "^e: |error:|FAILED|What went wrong|Exception" -A2 build.log | head -60 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' > err.txt
            echo "::error title=Build errors::$(cat err.txt)"
            exit 1
          fi

      - name: Rename APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed release APK. Is the SIGNING_KEYSTORE secret set?"
            exit 1
          fi
          cp "$APK" QuotaVault.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::No signed release bundle (.aab) for the Play Store."
            exit 1
          fi
          cp "$AAB" QuotaVault.aab
          # Shrinking scrambles class names; this file turns a crash report's lines back into real ones.
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$MAP" ]; then
            echo "::error::No mapping.txt: is code shrinking still on?"
            exit 1
          fi
          cp "$MAP" QuotaVault-mapping.txt
          # The bundle must be signed with the permanent key (it becomes the Play upload key).
          jarsigner -verify QuotaVault.aab | grep -q "jar verified" || { echo "::error::QuotaVault.aab is not signed."; exit 1; }

      - name: Privacy audit (fails the build if the app could reach the internet or be debugged)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions QuotaVault.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The app requests INTERNET. That breaks the privacy promise; build stopped."
            exit 1
          fi
          if grep -q "android.permission.USE_EXACT_ALARM" permissions.txt; then
            echo "::error::USE_EXACT_ALARM is restricted on Google Play for apps whose main purpose isn't alarms or a calendar; build stopped."
            exit 1
          fi
          if "$AAPT2" dump badging QuotaVault.apk | grep -q "application-debuggable"; then
            echo "::error::The app is debuggable. Release builds must not be; build stopped."
            exit 1
          fi
          grep -o "name='[^']*'" permissions.txt | sed "s/name='\(.*\)'/- \1/" | sort -u > permission-list.md
          echo "Permissions:"; cat permission-list.md

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: QuotaVault-build
          path: |
            QuotaVault.apk
            QuotaVault.aab
            QuotaVault-mapping.txt

      - name: Publish to Releases (download link for your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          {
            echo "**Phone:** open this page on your Android phone, tap **QuotaVault.apk** to download, then open it to install."
            echo
            echo "**Google Play:** upload **QuotaVault.aab** in Play Console (Testing or Production → Create new release)."
            echo
            echo "**Privacy check passed:** no internet access, not debuggable. Every Android permission this build has:"
            echo
            cat permission-list.md
            echo
            echo "Built from commit ${{ github.sha }}."
          } > notes.md
          gh release create "$TAG" QuotaVault.apk QuotaVault.aab QuotaVault-mapping.txt \
            --title "Quota Vault build ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest

  # Installs the shrunk release build on an Android emulator and taps through every screen,
  # a PDF report and an encrypted backup. Fails if the app crashes anywhere.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: QuotaVault-build

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the release build and tap through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/smoke_test.py QuotaVault.apk

      - name: Publish the screenshots (smoke-test release)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke
          [ -f smoke/summary.txt ] || echo "The test script did not start (emulator or install problem)." > smoke/summary.txt
          echo "Run ${{ github.run_number }}, commit ${{ github.sha }}" > smoke/run.txt
          gh release view smoke-test >/dev/null 2>&1 || gh release create smoke-test --title "Emulator smoke test" --notes "Screenshots from the latest emulator run of the release build." --prerelease
          # Clear the previous run's files so nothing stale is left behind.
          for a in $(gh release view smoke-test --json assets --jq '.assets[].name'); do gh release delete-asset smoke-test "$a" -y || true; done
          find smoke -type f -empty -delete   # GitHub refuses empty files
          gh release upload smoke-test smoke/* --clobber || true
          cat smoke/summary.txt
