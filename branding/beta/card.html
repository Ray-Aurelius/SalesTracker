<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lexend;src:local("Lexend");font-weight:100 900}
html,body{margin:0}
body{width:1200px;height:1800px;background:radial-gradient(ellipse 80% 55% at 50% 62%,#4a3328 0%,#2b2f35 55%,#23262b 100%);font-family:Lexend,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.bar{position:absolute;top:0;left:0;right:0;height:16px;background:#F26B1D}
.lockup{width:640px;margin-top:130px}
.tag{font-size:40px;color:#ffb68c;margin-top:22px;font-weight:400}
h1{font-size:96px;line-height:1.05;margin:96px 0 0;font-weight:700;text-align:center;letter-spacing:-1px}
h1 em{font-style:normal;color:#F26B1D}
.qr{margin-top:70px;background:#fff;border-radius:44px;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.qr img{width:560px;height:560px;display:block}
.chips{display:flex;gap:20px;margin-top:64px}
.chip{border:3px solid #F26B1D;border-radius:999px;padding:12px 30px;font-size:34px;font-weight:500}
.url{position:absolute;bottom:70px;font-size:30px;color:#a3a8ae}
</style></head><body><div class="bar"></div>
<img class="lockup" src="../final/quota-vault-lockup-dark.svg" alt="Quota Vault">
<div class="tag">The private sales tracker</div>
<h1>Scan to join<br>the <em>beta</em></h1>
<div class="qr"><img src="QuotaVault-Beta-QR.svg" alt=""></div>
<div class="chips"><div class="chip">Android</div><div class="chip">Free while testing</div><div class="chip">2 minutes</div></div>
<div class="url">ray-aurelius.github.io/SalesTracker/beta.html</div>
</body></html>
