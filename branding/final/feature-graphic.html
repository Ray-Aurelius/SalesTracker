<html><head><style>
@font-face{font-family:Lexend;src:url(../../app/src/main/res/font/lexend_variable.ttf);font-weight:100 900}
body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Lexend,sans-serif}
.wrap{width:1024px;height:500px;background:#1A1D22;display:flex;align-items:center;box-sizing:border-box;padding:0 48px 0 64px;gap:52px;color:#F6ECE8}

.chips{display:flex;flex-wrap:wrap;gap:9px;max-width:600px}

</style></head><body><div class="wrap">
<img class="mark" src="../wordmark/qv-c-mark-dark.svg">
<div><img class="name" src="../wordmark/qv-c-name-dark.svg"><div class="tag">The private sales tracker</div>
<div class="chips"><span class="chip">No subscription</span><span class="chip">No ads</span><span class="chip">No internet access</span><span class="chip">Encrypted</span></div></div>
</div></body></html>
